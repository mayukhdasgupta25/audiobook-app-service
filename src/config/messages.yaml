# API Information
api:
  info:
    title: "AudioBook API Server"
    version: "1.0.0"
    status_running: "running"
    endpoints:
      health: "/api/health"
      docs: "/api-docs"

# Validation Rules
validation:
  pagination:
    max_limit: 100
    default_limit: 10
    default_page: 1

  sort_fields:
    allowed: ["title", "author", "createdAt", "updatedAt", "duration"]

  string_fields:
    max_length: 100

  isbn:
    formats: ["10-digit", "13-digit"]

# File Information
file_info:
  created: "2024-01-01"
  description: "Centralized response messages for AudioBook API"
  version: "1.0.0"
  author: "AudioBook API Team"
